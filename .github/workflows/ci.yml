name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging frontend
        run: python -m pip install --disable-pip-version-check "pip>=26.1.2"
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test
        run: python -m pytest

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Upgrade packaging frontend
        run: python -m pip install --disable-pip-version-check "pip>=26.1.2"
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Type check the reference adapters
        run: python -m mypy --strict examples/local_provider.py
      - name: Security tests and aggregate coverage
        run: python -m pytest -q
      # Per-module branch-coverage floors so no single file can regress behind
      # the aggregate gate. Floors are a ratchet at the level each module
      # already reaches; raise them, never lower them.
      - name: Per-module branch coverage
        run: |
          set -eu
          while read -r module floor; do
            [ -n "$module" ] || continue
            echo "::group::$module >= $floor%"
            python -m coverage report \
              --include="src/ebics_read/$module" --fail-under="$floor"
            echo "::endgroup::"
          done <<'FLOORS'
          backend.py 83
          btd.py 84
          certificates.py 90
          client.py 90
          e002.py 95
          h005.py 90
          haa.py 81
          hev.py 90
          hia.py 95
          hkd.py 78
          hpb.py 85
          hpd.py 90
          htd.py 95
          ini.py 95
          models.py 82
          runtime.py 85
          transport.py 85
          x002.py 85
          xml.py 90
          FLOORS
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: Dependency audit
        run: python -m pip_audit --skip-editable

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Upgrade packaging frontend
        run: python -m pip install --disable-pip-version-check "pip>=26.1.2"
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel artifact
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Import installed artifact
        run: python -I -c "import ebics_read; assert ebics_read.__all__"
